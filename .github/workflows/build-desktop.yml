name: Build Electron desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/electron/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            command: npm run dist:win
            artifact: desktop-windows-unsigned
            artifact_path: desktop/electron/release/*.exe
          - platform: linux
            runner: ubuntu-latest
            command: npm run dist:linux
            artifact: desktop-linux-unsigned
            artifact_path: |
              desktop/electron/release/*.AppImage
              desktop/electron/release/*.deb
          - platform: macos
            runner: macos-latest
            command: npm run dist:mac
            artifact: desktop-macos-unsigned
            artifact_path: |
              desktop/electron/release/*.dmg
              desktop/electron/release/*.zip
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop/electron
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test shell
        run: npm test

      - name: Package unsigned shell
        run: ${{ matrix.command }}

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
