name: Electron CI

on:
  pull_request:
    paths:
      - "desktop/electron/**"
      - ".github/workflows/electron-ci.yml"

permissions:
  contents: read

concurrency:
  group: electron-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Electron shell
        run: npm run build

      - name: Test Electron shell
        run: npm test
