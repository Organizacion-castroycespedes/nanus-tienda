name: Deploy QA Backends

on:
  push:
    branches:
      - release/evolutivo/0.0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build backend binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            backend-reporteria/package-lock.json
            backend-facturacion-electronica/package-lock.json
            backend-perifericos/package-lock.json

      - name: Build pkg binaries
        shell: bash
        run: |
          set -euo pipefail
          for service in api backend-reporteria backend-facturacion-electronica backend-perifericos; do
            echo "Building ${service}"
            (
              cd "${service}"
              npm ci
              npm run build:bin
            )
          done

      - name: Verify Linux binaries
        shell: bash
        run: |
          chmod +x scripts/build/verify-backend-binaries.sh
          scripts/build/verify-backend-binaries.sh

      - name: Package Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/linux artifact/scripts/deploy artifact/scripts/pm2
          cp api/dist-bin/api-linux artifact/linux/api-linux
          cp backend-reporteria/dist-bin/backend-reporteria-linux artifact/linux/backend-reporteria-linux
          cp backend-facturacion-electronica/dist-bin/backend-facturacion-electronica-linux artifact/linux/backend-facturacion-electronica-linux
          cp backend-perifericos/dist-bin/backend-perifericos-linux artifact/linux/backend-perifericos-linux
          cp scripts/deploy/qa-deploy-backends.sh artifact/scripts/deploy/qa-deploy-backends.sh
          cp scripts/pm2/ecosystem.qa.config.js artifact/scripts/pm2/ecosystem.qa.config.js
          tar -C artifact -czf qa-backends-linux.tar.gz .

      - name: Upload Linux backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-backends-linux
          path: qa-backends-linux.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to QA AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/release/evolutivo/0.0.1' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Linux backend artifact
        uses: actions/download-artifact@v4
        with:
          name: qa-backends-linux

      - name: Validate required secrets
        shell: bash
        env:
          QA_SSH_HOST: ${{ secrets.QA_SSH_HOST }}
          QA_SSH_USER: ${{ secrets.QA_SSH_USER }}
          QA_SSH_PRIVATE_KEY: ${{ secrets.QA_SSH_PRIVATE_KEY }}
          QA_DEPLOY_BASE_PATH: ${{ secrets.QA_DEPLOY_BASE_PATH }}
          QA_API_BASE_URL: ${{ secrets.QA_API_BASE_URL }}
        run: |
          set -euo pipefail
          : "${QA_SSH_HOST:?Missing QA_SSH_HOST}"
          : "${QA_SSH_USER:?Missing QA_SSH_USER}"
          : "${QA_SSH_PRIVATE_KEY:?Missing QA_SSH_PRIVATE_KEY}"
          : "${QA_DEPLOY_BASE_PATH:?Missing QA_DEPLOY_BASE_PATH}"
          : "${QA_API_BASE_URL:?Missing QA_API_BASE_URL}"

      - name: Configure SSH
        shell: bash
        env:
          QA_SSH_HOST: ${{ secrets.QA_SSH_HOST }}
          QA_SSH_PRIVATE_KEY: ${{ secrets.QA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${QA_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${QA_SSH_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload artifact to QA host
        shell: bash
        env:
          QA_SSH_HOST: ${{ secrets.QA_SSH_HOST }}
          QA_SSH_USER: ${{ secrets.QA_SSH_USER }}
          QA_DEPLOY_BASE_PATH: ${{ secrets.QA_DEPLOY_BASE_PATH }}
        run: |
          set -euo pipefail
          remote_tmp="${QA_DEPLOY_BASE_PATH%/}/tmp/github-actions/backends-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "${QA_SSH_USER}@${QA_SSH_HOST}" "mkdir -p '${remote_tmp}'"
          scp qa-backends-linux.tar.gz "${QA_SSH_USER}@${QA_SSH_HOST}:${remote_tmp}/qa-backends-linux.tar.gz"
          echo "REMOTE_TMP=${remote_tmp}" >> "${GITHUB_ENV}"

      - name: Deploy binaries on QA host
        shell: bash
        env:
          QA_SSH_HOST: ${{ secrets.QA_SSH_HOST }}
          QA_SSH_USER: ${{ secrets.QA_SSH_USER }}
          QA_DEPLOY_BASE_PATH: ${{ secrets.QA_DEPLOY_BASE_PATH }}
        run: |
          set -euo pipefail
          ssh "${QA_SSH_USER}@${QA_SSH_HOST}" \
            "cd '${REMOTE_TMP}' && tar -xzf qa-backends-linux.tar.gz && DEPLOY_BASE_PATH='${QA_DEPLOY_BASE_PATH%/}' RUN_LOCAL_SMOKE=YES RUN_PM2_SAVE=NO bash scripts/deploy/qa-deploy-backends.sh '${REMOTE_TMP}/linux'"

      - name: Public smoke checks
        shell: bash
        env:
          QA_API_BASE_URL: ${{ secrets.QA_API_BASE_URL }}
        run: |
          set -euo pipefail
          base_url="${QA_API_BASE_URL%/}"
          curl -fsS "${base_url}/api/system/version" >/dev/null
          curl -fsS "${base_url}/api/reports/health" >/dev/null
