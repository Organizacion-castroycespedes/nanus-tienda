name: Deploy Production Master VPS

on:
  push:
    branches:
      - master
      - feat/develop/deploy-config-master
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24.21.0"

jobs:
  build:
    name: Build web and backends
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json
            backend-reporteria/package-lock.json
            backend-facturacion-electronica/package-lock.json

      - name: Build web
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_REPORTS_API_BASE_URL: /api
          API_PROXY_TARGET: http://127.0.0.1:4020
          NEXT_PUBLIC_PERIPHERALS_AGENT_HTTP_URL: http://localhost:4050
          NEXT_PUBLIC_PERIPHERALS_AGENT_WS_URL: ws://localhost:4050/peripherals
          NEXT_PUBLIC_PERIPHERALS_ENABLED: "true"
          NEXT_PUBLIC_PERIPHERALS_PRINT_SALE_ENABLED: "true"
          NEXT_PUBLIC_PERIPHERALS_PRINT_PURCHASE_ENABLED: "true"
          NEXT_PUBLIC_PERIPHERALS_PRINT_ORDER_ENABLED: "true"
          NEXT_PUBLIC_PERIPHERALS_OPEN_DRAWER_ENABLED: "true"
          NEXT_PUBLIC_PERIPHERALS_SCALE_ENABLED: "true"
          NEXT_PUBLIC_PERIPHERALS_SCANNER_ENABLED: "true"
        run: |
          npm ci
          npm run build

      - name: Build backend binaries
        shell: bash
        run: |
          set -euo pipefail
          for service in api backend-reporteria backend-facturacion-electronica; do
            (
              cd "${service}"
              npm ci
              npm run release
            )
          done

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact
          mkdir -p artifact/linux artifact/web
          cp api/dist-bin/emaus_api artifact/linux/emaus_api
          cp backend-reporteria/dist-bin/emaus_reporteria artifact/linux/emaus_reporteria
          cp backend-facturacion-electronica/dist-bin/emaus_facturacion artifact/linux/emaus_facturacion
          cp -R web/.next web/public web/package.json web/package-lock.json web/next.config.mjs artifact/web/
          cp scripts/deploy/prod-deploy-full.sh artifact/prod-deploy-full.sh
          tar -C artifact -czf prod-master-release.tar.gz .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-master-release
          path: prod-master-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-master-release

      - name: Validate deploy secrets
        shell: bash
        env:
          PROD_VPS_HOST: ${{ secrets.PROD_VPS_HOST }}
          PROD_VPS_USER: ${{ secrets.PROD_VPS_USER }}
          PROD_VPS_SSH_KEY: ${{ secrets.PROD_VPS_SSH_KEY }}
          PROD_DEPLOY_BASE_PATH: ${{ secrets.PROD_DEPLOY_BASE_PATH }}
        run: |
          set -euo pipefail
          : "${PROD_VPS_HOST:?Missing PROD_VPS_HOST}"
          : "${PROD_VPS_USER:?Missing PROD_VPS_USER}"
          : "${PROD_VPS_SSH_KEY:?Missing PROD_VPS_SSH_KEY}"
          : "${PROD_DEPLOY_BASE_PATH:?Missing PROD_DEPLOY_BASE_PATH}"

      - name: Configure SSH
        shell: bash
        env:
          PROD_VPS_HOST: ${{ secrets.PROD_VPS_HOST }}
          PROD_VPS_PORT: ${{ secrets.PROD_VPS_PORT }}
          PROD_VPS_SSH_KEY: ${{ secrets.PROD_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${PROD_VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PROD_VPS_PORT:-22}" -H "${PROD_VPS_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH authentication
        shell: bash
        env:
          PROD_VPS_HOST: ${{ secrets.PROD_VPS_HOST }}
          PROD_VPS_PORT: ${{ secrets.PROD_VPS_PORT }}
          PROD_VPS_USER: ${{ secrets.PROD_VPS_USER }}
          PROD_DEPLOY_BASE_PATH: ${{ secrets.PROD_DEPLOY_BASE_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            -p "${PROD_VPS_PORT:-22}" "${PROD_VPS_USER}@${PROD_VPS_HOST}" \
            "id -un && test -d '${PROD_DEPLOY_BASE_PATH}' && test -w '${PROD_DEPLOY_BASE_PATH}'"

      - name: Upload release
        shell: bash
        env:
          PROD_VPS_HOST: ${{ secrets.PROD_VPS_HOST }}
          PROD_VPS_USER: ${{ secrets.PROD_VPS_USER }}
          PROD_VPS_PORT: ${{ secrets.PROD_VPS_PORT }}
          PROD_DEPLOY_BASE_PATH: ${{ secrets.PROD_DEPLOY_BASE_PATH }}
        run: |
          set -euo pipefail
          remote_tmp="${PROD_DEPLOY_BASE_PATH%/}/tmp/github-actions/prod-master-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -p "${PROD_VPS_PORT:-22}" "${PROD_VPS_USER}@${PROD_VPS_HOST}" "mkdir -p '${remote_tmp}'"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -P "${PROD_VPS_PORT:-22}" prod-master-release.tar.gz "${PROD_VPS_USER}@${PROD_VPS_HOST}:${remote_tmp}/prod-master-release.tar.gz"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -p "${PROD_VPS_PORT:-22}" "${PROD_VPS_USER}@${PROD_VPS_HOST}" \
            "cd '${remote_tmp}' && tar -xzf prod-master-release.tar.gz && DEPLOY_BASE_PATH='${PROD_DEPLOY_BASE_PATH%/}' bash prod-deploy-full.sh '${remote_tmp}'"

      - name: Public smoke checks
        shell: bash
        env:
          PROD_WEB_BASE_URL: ${{ secrets.PROD_WEB_BASE_URL }}
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
        run: |
          set -euo pipefail
          : "${PROD_WEB_BASE_URL:?Missing PROD_WEB_BASE_URL}"
          : "${PROD_API_BASE_URL:?Missing PROD_API_BASE_URL}"
          curl --fail --silent --show-error "${PROD_WEB_BASE_URL%/}/login" >/dev/null
          curl --fail --silent --show-error "${PROD_API_BASE_URL%/}/api/system/version" >/dev/null
          curl --fail --silent --show-error "${PROD_API_BASE_URL%/}/api/reports/health" >/dev/null
