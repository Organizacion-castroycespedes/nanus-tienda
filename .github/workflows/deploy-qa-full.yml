name: Deploy Master VPS Full Stack

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24.21.0"

jobs:
  build:
    name: Build web and backends
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json
            backend-reporteria/package-lock.json
            backend-facturacion-electronica/package-lock.json

      - name: Build web
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_REPORTS_API_BASE_URL: /api
          NEXT_PUBLIC_PERIPHERALS_AGENT_HTTP_URL: http://localhost:4050
          NEXT_PUBLIC_PERIPHERALS_AGENT_WS_URL: ws://localhost:4050/peripherals
          NEXT_PUBLIC_PERIPHERALS_ENABLED: "true"
          NEXT_PUBLIC_PERIPHERALS_PRINT_SALE_ENABLED: "true"
          NEXT_PUBLIC_PERIPHERALS_PRINT_PURCHASE_ENABLED: "true"
          NEXT_PUBLIC_PERIPHERALS_PRINT_ORDER_ENABLED: "true"
          NEXT_PUBLIC_PERIPHERALS_OPEN_DRAWER_ENABLED: "true"
          NEXT_PUBLIC_PERIPHERALS_SCALE_ENABLED: "true"
          NEXT_PUBLIC_PERIPHERALS_SCANNER_ENABLED: "true"
        run: |
          npm ci
          npm run build

      - name: Build backend binaries
        shell: bash
        run: |
          set -euo pipefail
          for service in api backend-reporteria backend-facturacion-electronica; do
            (
              cd "${service}"
              npm ci
              npm run release
            )
          done

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact
          mkdir -p artifact/linux artifact/web
          cp api/dist-bin/emaus_api artifact/linux/emaus_api
          cp backend-reporteria/dist-bin/emaus_reporteria artifact/linux/emaus_reporteria
          cp backend-facturacion-electronica/dist-bin/emaus_facturacion artifact/linux/emaus_facturacion
          cp -R web/.next web/public web/package.json web/package-lock.json web/next.config.mjs artifact/web/
          cp scripts/deploy/qa-deploy-full.sh artifact/qa-deploy-full.sh
          tar -C artifact -czf qa-full-release.tar.gz .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-full-release
          path: qa-full-release.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Master VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: qa-full-release

      - name: Validate deploy secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_BASE_PATH: ${{ secrets.VPS_DEPLOY_BASE_PATH }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          : "${VPS_DEPLOY_BASE_PATH:?Missing VPS_DEPLOY_BASE_PATH}"

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_PORT:-22}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_BASE_PATH: ${{ secrets.VPS_DEPLOY_BASE_PATH }}
        run: |
          set -euo pipefail
          remote_tmp="${VPS_DEPLOY_BASE_PATH%/}/tmp/github-actions/full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "mkdir -p '${remote_tmp}'"
          scp -P "${VPS_PORT:-22}" qa-full-release.tar.gz "${VPS_USER}@${VPS_HOST}:${remote_tmp}/qa-full-release.tar.gz"
          ssh -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "cd '${remote_tmp}' && tar -xzf qa-full-release.tar.gz && DEPLOY_BASE_PATH='${VPS_DEPLOY_BASE_PATH%/}' bash qa-deploy-full.sh '${remote_tmp}'"

      - name: Public smoke checks
        shell: bash
        env:
          QA_WEB_BASE_URL: ${{ secrets.QA_WEB_BASE_URL }}
          QA_API_BASE_URL: ${{ secrets.QA_API_BASE_URL }}
        run: |
          set -euo pipefail
          : "${QA_WEB_BASE_URL:?Missing QA_WEB_BASE_URL}"
          : "${QA_API_BASE_URL:?Missing QA_API_BASE_URL}"
          curl --fail --silent --show-error "${QA_WEB_BASE_URL%/}/login" >/dev/null
          curl --fail --silent --show-error "${QA_API_BASE_URL%/}/api/system/version" >/dev/null
          curl --fail --silent --show-error "${QA_API_BASE_URL%/}/api/reports/health" >/dev/null
